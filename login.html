<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Dream Velvet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
    }

    .auth-container {
      max-width: 450px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #800080;
    }

    .toggle-link {
      text-align: center;
      margin-top: 15px;
    }

    .toggle-link a {
      color: #800080;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <h2 id="formTitle">Login</h2>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" style="display:none;">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" id="signupName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="signupEmail" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" id="signupPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Phone</label>
        <input type="text" id="signupPhone" class="form-control">
      </div>
      <button type="submit" class="btn btn-success w-100">Sign Up</button>
    </form>

    <!-- Toggle -->
    <div class="toggle-link">
      <p id="toggleText">Don’t have an account? <a onclick="toggleForms()">Sign Up</a></p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAT80QXTEwAgGnOB6N1lzpH-vdc98LoPfQ",
      authDomain: "dreamvelvet-377e0.firebaseapp.com",
      projectId: "dreamvelvet-377e0",
      storageBucket: "dreamvelvet-377e0.appspot.com",
      messagingSenderId: "821302105933",
      appId: "1:821302105933:web:bada4e32794a5fa35b8904"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Toggle forms
    function toggleForms() {
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const title = document.getElementById("formTitle");
      const toggleText = document.getElementById("toggleText");

      if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
        title.innerText = "Login";
        toggleText.innerHTML = `Don’t have an account? <a onclick="toggleForms()">Sign Up</a>`;
      } else {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        title.innerText = "Sign Up";
        toggleText.innerHTML = `Already have an account? <a onclick="toggleForms()">Login</a>`;
      }
    }

    // Sign Up
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signupName").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const phone = document.getElementById("signupPhone").value;

      try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(userCred.user.uid).set({
          name,
          email,
          phone,
          role: "user", // default role
          createdAt: new Date().toISOString()
        });
        alert("✅ Signup successful! Please login.");
        toggleForms();
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    // Login
    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const doc = await db.collection("users").doc(userCred.user.uid).get();
        if (doc.exists) {
          const role = doc.data().role || "user";

          // 🔥 Save login flag
          localStorage.setItem("isLoggedIn", "true");

          if (role === "admin") {
            window.location.href = "admin-dashboard.html";
          } else {
            window.location.href = "userdashboard.html";
          }
        } else {
          alert("⚠️ User data not found!");
        }
      } catch (err) {
        alert("Login Failed: " + err.message);
      }
    });

  </script>

</body>

</html>
